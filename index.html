<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS2 Skin Balance Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1b1b1b;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
    }
    h1 { color: #00ff99; }
    input, select {
      padding: 10px;
      margin: 5px 0;
      width: 220px;
      border-radius: 5px;
      border: none;
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background-color: #00ff99;
      color: #1b1b1b;
      font-weight: bold;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      text-align: center;
    }
    .profit { color: #00ff99; }
    .loss { color: #ff4c4c; }
    .hidden { display: none; }
  </style>
</head>
<body>

<h1>CS2 Skin Balance Calculator</h1>

<label>Buy Price:</label>
<input type="number" id="buyPrice" step="0.01">

<label>Sell Price:</label>
<input type="number" id="sellPrice" step="0.01">

<label>Transaction Type:</label>
<select id="transactionType" onchange="toggleSteamFactor()">
  <option value="floatToSteam">Buy on Float → Sell on Steam</option>
  <option value="steamToFloat">Buy on Steam → Sell on Float</option>
</select>

<div id="steamFactorBox" class="hidden">
  <label>Steam Balance Cost (%):</label>
  <input type="number" id="steamFactor" value="70" min="60" max="80" step="1">
</div>

<label>Currency for Buy Price:</label>
<select id="buyCurrency">
  <option value="PLN">PLN</option>
  <option value="USD">USD</option>
  <option value="EUR">EUR</option>
  <option value="CNY">CNY</option>
</select>

<label>Currency for Sell Price:</label>
<select id="sellCurrency">
  <option value="PLN">PLN</option>
  <option value="USD">USD</option>
  <option value="EUR">EUR</option>
  <option value="CNY">CNY</option>
</select>

<button onclick="calculateBalance()">Check Balance</button>

<div class="result" id="result">Enter prices to calculate.</div>

<script>
const exchangeRates = {
  PLN: 1,
  USD: 3.59,
  EUR: 4.22,
  CNY: 0.52
};

const STEAM_FEE = 0.13;
const FLOAT_FEE = 0.02;

function toggleSteamFactor() {
  steamFactorBox.classList.toggle(
    'hidden',
    transactionType.value !== 'steamToFloat'
  );
}

function calculateBalance() {
  const buy = parseFloat(buyPrice.value);
  const sell = parseFloat(sellPrice.value);
  const type = transactionType.value;

  if (!buy || !sell) {
    result.innerHTML = `<span class="loss">Invalid input</span>`;
    return;
  }

  const buyPLN = buy * exchangeRates[buyCurrency.value];
  const sellPLN = sell * exchangeRates[sellCurrency.value];

  if (type === 'floatToSteam') {
    // 🔥 POZYSKANIE STEAM BALANCE
    const steamBalance = sellPLN * (1 - STEAM_FEE);
    const percent = (buyPLN / steamBalance) * 100;

    result.innerHTML = `
      <span class="profit">
        You obtained Steam balance for ${percent.toFixed(0)}% of its value
      </span>
    `;
  } else {
    // 🔥 STEAM → FLOAT (PROFIT)
    const factor = parseFloat(steamFactor.value) / 100;
    const realCost = buyPLN * factor;
    const netSell = sellPLN * (1 - FLOAT_FEE);
    const profit = netSell - realCost;
    const percent = (profit / realCost) * 100;

    result.innerHTML = `
      <span class="${profit >= 0 ? 'profit' : 'loss'}">
        Profit: ${profit.toFixed(2)} PLN (${percent.toFixed(2)}%)
      </span>
    `;
  }
}
</script>

</body>
</html>
